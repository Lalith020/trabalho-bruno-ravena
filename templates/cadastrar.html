{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h2 class="mb-4 text-center">Cadastrar Nova Operação</h2>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Data</label>
                    <input type="date" name="data" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Código do Ativo (Ex: PETR4)</label>
                    <input type="text" name="ativo" class="form-control" placeholder="Ex: PETR4" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Quantidade</label>
                    <input type="number" name="quantidade" class="form-control" min="1" placeholder="Ex: 100" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Valor Unitário (R$)</label>
                    <input type="number" step="0.01" name="valor_unitario" class="form-control" placeholder="0.00" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Tipo de Operação</label>
                    <select name="tipo_operacao" class="form-select" required>
                        <option value="compra">Compra</option>
                        <option value="venda">Venda</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100 mb-2">Salvar Operação</button>
                <a href="{{ url_for('operacao.listar') }}" class="btn btn-secondary w-100">Voltar à Listagem</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
