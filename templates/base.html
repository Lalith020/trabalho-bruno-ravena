<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Corretora de Valores - MVC</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar de Navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('operacao.listar') }}">📈 Corretora MVC</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('operacao.listar') }}">Listar Operações</a>
                <a class="nav-link" href="{{ url_for('operacao.cadastrar') }}">Nova Operação</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Mensagens Flash para Alertas e Erros -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Bloco dinâmico onde o conteúdo das outras páginas é injetado -->
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
