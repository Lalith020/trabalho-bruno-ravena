{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h2 class="mb-4 text-center">Atualizar Operação #{{ operacao.id }}</h2>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Data</label>
                    <input type="date" name="data" class="form-control" value="{{ operacao.data }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Código do Ativo</label>
                    <input type="text" name="ativo" class="form-control" value="{{ operacao.ativo }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Quantidade</label>
                    <input type="number" name="quantidade" class="form-control" value="{{ operacao.quantidade }}" min="1" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Valor Unitário (R$)</label>
                    <input type="number" step="0.01" name="valor_unitario" class="form-control" value="{{ operacao.valor_unitario }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Tipo de Operação</label>
                    <select name="tipo_operacao" class="form-select" required>
                        <option value="compra" {{ 'selected' if operacao.tipo_operacao == 'compra' else '' }}>Compra</option>
                        <option value="venda" {{ 'selected' if operacao.tipo_operacao == 'venda' else '' }}>Venda</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-2">Atualizar Operação</button>
                <a href="{{ url_for('operacao.listar') }}" class="btn btn-secondary w-100">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
